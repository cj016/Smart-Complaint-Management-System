<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a8a">
  <title>{% block title %}SCMS{% endblock %} - Smart Complaint Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="{{ url_for('web.index') }}">SCMS</a>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="{{ url_for('web.index') }}">Home</a>

      <!-- Guest links -->
      <a href="{{ url_for('web.login_page') }}"
         data-auth="out" hidden>Login</a>
      <a href="{{ url_for('web.register_page') }}"
         data-auth="out" hidden>Register</a>

      <!-- Citizen links -->
      <a href="{{ url_for('web.lodge') }}"
         data-roles="Complainant" hidden>Lodge Complaint</a>
      <a href="{{ url_for('web.my_complaints') }}"
         data-roles="Complainant" hidden>My Complaints</a>
      <a href="{{ url_for('web.notifications_page') }}"
         data-roles="Complainant" hidden>Notifications</a>
      <a href="{{ url_for('web.track') }}"
         data-roles="Complainant" hidden>Track by ID</a>

      <!-- Staff links -->
      <a href="{{ url_for('web.admin_dashboard') }}"
         data-roles="Admin,Officer" hidden>Dashboard</a>
      <a href="{{ url_for('web.staff_notifications_page') }}"
         data-roles="Admin,Officer" hidden>Staff Notifications</a>

      <!-- Signed-in user -->
      <span id="nav-user" class="nav-user"
            data-auth="in" hidden></span>
      <button type="button" id="logout-btn"
              class="nav-logout" data-auth="in" hidden>
        Logout
      </button>
    </nav>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    Smart Complaint Management System - Team 9
  </footer>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ui_enhancements.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
