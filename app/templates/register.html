{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <h1>Citizen Registration</h1>
  <form id="register-form">
    <label for="name">Full name</label>
    <input id="name" name="name" required maxlength="120">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="mobile">Mobile (optional)</label>
    <input id="mobile" name="mobile" type="tel" pattern="\+?[0-9]{10,15}">
    <label for="password">Password (min 8 characters)</label>
    <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" minlength="8" required autocomplete="new-password">
    <button type="submit">Register</button>
  </form>

  <form id="otp-form" hidden>
    <label for="otp">Enter OTP</label>
    <input id="otp" name="otp" inputmode="numeric" maxlength="6" required>
    <button type="submit">Verify</button>
    <button type="button" id="resend-btn">Resend OTP</button>
  </form>

  <p id="message" role="status"></p>
  <p>Already registered? <a href="/login">Log in</a></p>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
