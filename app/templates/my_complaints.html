{% extends "base.html" %}
{% block title %}My Complaints{% endblock %}
{% block content %}
  <h1>My Complaints</h1>

  <div id="login-warning" hidden>
    <p><strong>Please log in to see your complaints.</strong></p>
  </div>

  <section id="complaints-section" hidden>
    <label for="status-filter">Filter by status</label>
    <select id="status-filter">
      <option value="">All</option>
      <option>Submitted</option>
      <option>In Review</option>
      <option>Assigned</option>
      <option>In Progress</option>
      <option>Resolved</option>
      <option>Closed</option>
      <option>Reopened</option>
    </select>

    <p id="message" role="status"></p>

    <div style="overflow-x:auto">
      <table id="complaints-table">
        <thead>
          <tr>
            <th>Complaint ID</th><th>Category</th><th>Location</th>
            <th>Status</th><th>Submitted</th><th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <section id="reopen-panel" class="card" hidden>
      <h2>Reopen complaint <span id="reopen-id"></span></h2>
      <form id="reopen-form">
        <label for="reopen-reason">Reason for reopening (required)</label>
        <textarea id="reopen-reason" maxlength="2000" required rows="3"></textarea>
        <button id="reopen-submit" type="submit">Reopen complaint</button>
        <button id="reopen-cancel" type="button" class="btn-secondary">Cancel</button>
      </form>
      <p id="reopen-message" role="status"></p>
    </section>

    <div>
      <button id="prev-btn" type="button">Previous</button>
      <span id="page-info"></span>
      <button id="next-btn" type="button">Next</button>
    </div>
  </section>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='js/my_complaints.js') }}"></script>
{% endblock %}
